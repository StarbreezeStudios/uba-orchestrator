services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the UI certificate hostname}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_DIRECTORY:?Set TLS_DIRECTORY to the certificate directory}:/etc/nginx/tls:ro
    depends_on:
      uba-orchestrator:
        condition: service_healthy

  uba-orchestrator:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: uba-orchestrator:dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      UBA_ORCHESTRATOR_DB: /var/lib/uba-orchestrator/orchestrator.db
      JENKINS_BASE_URL: ${JENKINS_BASE_URL:-https://jk3.starbreeze.com}
    volumes:
      - orchestrator-data:/var/lib/uba-orchestrator
    init: true
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=2)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  orchestrator-data:
